name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure self-signed HTTPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            sudo apt-get update
            sudo apt-get install -y nginx openssl

            sudo mkdir -p /etc/ssl/sweethome
            if [ ! -f /etc/ssl/sweethome/selfsigned.crt ] || [ ! -f /etc/ssl/sweethome/selfsigned.key ]; then
              sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
                -keyout /etc/ssl/sweethome/selfsigned.key \
                -out /etc/ssl/sweethome/selfsigned.crt \
                -subj "/CN=176.109.109.155" \
                -addext "subjectAltName=IP:176.109.109.155"
            fi

            printf '%s\n' \
              'server {' \
              '    listen 80 default_server;' \
              '    server_name _;' \
              '    return 301 https://$host$request_uri;' \
              '}' \
              '' \
              'server {' \
              '    listen 443 ssl default_server;' \
              '    server_name _;' \
              '' \
              '    ssl_certificate     /etc/ssl/sweethome/selfsigned.crt;' \
              '    ssl_certificate_key /etc/ssl/sweethome/selfsigned.key;' \
              '    ssl_protocols       TLSv1.2 TLSv1.3;' \
              '' \
              '    location /api/ {' \
              '        proxy_pass http://127.0.0.1:5000;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '' \
              '    location /Account/ {' \
              '        proxy_pass http://127.0.0.1:5000;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '' \
              '    location /swagger/ {' \
              '        proxy_pass http://127.0.0.1:5000;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '' \
              '    location / {' \
              '        proxy_pass http://127.0.0.1:8080;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '}' \
              '' \
              'server {' \
              '    listen 8443 ssl;' \
              '    server_name _;' \
              '' \
              '    ssl_certificate     /etc/ssl/sweethome/selfsigned.crt;' \
              '    ssl_certificate_key /etc/ssl/sweethome/selfsigned.key;' \
              '    ssl_protocols       TLSv1.2 TLSv1.3;' \
              '' \
              '    location / {' \
              '        proxy_pass http://127.0.0.1:8090;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '}' | sudo tee /etc/nginx/sites-available/sweethome-selfsigned >/dev/null

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/sweethome-selfsigned /etc/nginx/sites-enabled/sweethome-selfsigned
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            sudo ufw allow 8443/tcp || true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f

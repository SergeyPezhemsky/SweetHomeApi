services:
  api:
    image: ${SWEETHOME_API_IMAGE:-sweethome-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      HomeAssistant__BaseUrl: ${HOMEASSISTANT_BASE_URL}
      HomeAssistant__AccessToken: ${HOMEASSISTANT_ACCESS_TOKEN}
      HomeAssistant__RequestTimeoutSeconds: ${HOMEASSISTANT_REQUEST_TIMEOUT_SECONDS:-60}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Удаление фона у фото гардероба; пустое значение выключает обработку.
      Flatlay__BaseUrl: ${FLATLAY_BASE_URL-http://flatlay:8000}
      # Распознавание чеков (вкладка «Финансы»): OpenAI-совместимый vision-провайдер, по умолчанию Yandex AI Studio.
      # Пустой ключ выключает распознавание — фото чеков сохраняются, сумму вводят вручную.
      Finance__Recognition__BaseUrl: ${FINANCE_LLM_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      Finance__Recognition__ApiKey: ${FINANCE_LLM_API_KEY:-}
      Finance__Recognition__AuthScheme: ${FINANCE_LLM_AUTH_SCHEME:-Api-Key}
      Finance__Recognition__Project: ${FINANCE_LLM_PROJECT:-}
      Finance__Recognition__Model: ${FINANCE_LLM_MODEL:-qwen3.6-35b-a3b}
      # Порядок провайдеров: первый основной, следующий — если первый недоступен или не прочитал чек.
      Finance__Recognition__Order: ${FINANCE_LLM_ORDER:-openai,anthropic}
      # Anthropic (Claude): пустой ключ выключает. Из России не обслуживается — нужен прокси за её пределами.
      Finance__Recognition__Anthropic__ApiKey: ${FINANCE_ANTHROPIC_API_KEY:-}
      Finance__Recognition__Anthropic__Model: ${FINANCE_ANTHROPIC_MODEL:-claude-haiku-5-5}
      Finance__Recognition__Anthropic__ProxyUrl: ${FINANCE_ANTHROPIC_PROXY:-}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Удаление фона у фото вещей (rembg). Наружу не публикуется, API ходит по внутренней сети.
  flatlay:
    image: ${SWEETHOME_FLATLAY_IMAGE:-sweethome-flatlay:local}
    build:
      context: ./flatlay
    restart: unless-stopped
    mem_limit: ${FLATLAY_MEM_LIMIT:-1536m}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sweethome-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sweethome-postgres-data:

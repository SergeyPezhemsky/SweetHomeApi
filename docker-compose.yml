services:
  api:
    image: ${SWEETHOME_API_IMAGE:-sweethome-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      HomeAssistant__BaseUrl: ${HOMEASSISTANT_BASE_URL}
      HomeAssistant__AccessToken: ${HOMEASSISTANT_ACCESS_TOKEN}
      HomeAssistant__RequestTimeoutSeconds: ${HOMEASSISTANT_REQUEST_TIMEOUT_SECONDS:-60}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Удаление фона у фото гардероба; пустое значение выключает обработку.
      Flatlay__BaseUrl: ${FLATLAY_BASE_URL-http://flatlay:8000}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flatlay:
        condition: service_started

  # Удаление фона у фото вещей (rembg). Наружу не публикуется, API ходит по внутренней сети.
  flatlay:
    image: ${SWEETHOME_FLATLAY_IMAGE:-sweethome-flatlay:local}
    build:
      context: ./flatlay
    restart: unless-stopped
    mem_limit: ${FLATLAY_MEM_LIMIT:-2g}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sweethome-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sweethome-postgres-data:
